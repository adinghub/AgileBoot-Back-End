# 基础公共配置（预生产环境）
#
# 预生产环境用于发版前联调与灰度验证。
# 这里的结构保持和生产完全一致，只是在需要时允许覆盖少量环境参数。

healthtrail:
  name: HealthTrail
  version: 1.8.0
  copyright-year: 2022
  demo-enabled: false
  addressEnabled: false
  captchaType: math
  rsaPrivateKey: 
  checkI18nKey: false
  traceRequestIdKey: AG-RequestId
  storage:
    type: MINIO
    minio:
      endpoint: oss-api.dingqidong.com
      bucket: healthtrail-prod
      access-key: blog
      secret-key: F^PbbdM6Xuu&NhF4
      use-ssl: true
      public-url-prefix: https://oss-api.dingqidong.com/healthtrail-prod/
  embedded:
    mysql: false
    redis: false

logging:
  level:
    com.healthtrail: info
    org.springframework: info
  pattern:
    console: "%date requestId:%X{${healthtrail.traceRequestIdKey}} %thread %green(%level) [%cyan(%logger{10}):%magenta(%line)] %red(%method) | %msg%n"

spring:
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: false
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss

token:
  header: Authorization
  secret: sdhfkjshBN6rr32df38
  autoRefreshTime: 20

mybatis-plus:
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configuration:
    cacheEnabled: true
    useGeneratedKeys: true
    defaultExecutorType: SIMPLE
    logImpl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    refresh: true

pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    groups:
      enabled: true
  packages-to-scan: com.healthtrail

health:
  report:
    parser:
      auto-parse-on-upload: true
      image-ocr-command: ${HEALTH_REPORT_IMAGE_OCR_COMMAND:}
      command-timeout-seconds: ${HEALTH_REPORT_IMAGE_OCR_TIMEOUT_SECONDS:60}
    ocr:
      enabled: false
      provider: ALIYUN
      aliyun:
        access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
        access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
        endpoint: ocr-api.cn-hangzhou.aliyuncs.com
        type: Advanced
        connect-timeout-ms: 10000
        read-timeout-ms: 30000
    ai:
      structured-parse:
        enabled: true
        min-rule-item-count: 2
        max-prompt-text-length: 12000
        prefer-vision-on-image: true
        include-ocr-text-when-vision-enabled: true
        max-image-bytes: 2097152
      external-llm:
        enabled: false
        provider-name: Zhipu-GLM
        api-url: ${HEALTH_REPORT_EXTERNAL_LLM_API_URL:https://open.bigmodel.cn/api/paas/v4/chat/completions}
        api-key: ${HEALTH_REPORT_EXTERNAL_LLM_API_KEY:${ZHIPU_API_KEY:}}
        model: ${HEALTH_REPORT_EXTERNAL_LLM_MODEL:glm-4.6v-flash}
        supports-image-input: true
        temperature: 0.2
        max-tokens: 700
        timeout-ms: 15000
        headers:
          X-App-Name: HealthTrail-Health
        system-prompt: >
          你是一名医疗健康管理总结助手。请基于结构化体检报告数据输出简明、可信、
          可执行的中文总结，不要杜撰未提供的信息，不要给出确诊结论。对明确异常的
          重点指标，在医学上能够合理推断时，可补充“可能出现的常见症状/不适表现”
          提示，但必须使用“可能、如伴有、若近期存在”等风险提示语气，不能把症状
          写成已经发生的事实。
