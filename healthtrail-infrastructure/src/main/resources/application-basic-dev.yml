# 基础公共配置（开发环境）
#
# 说明：
# 1. 这里只放 admin / api 共用，且跟“环境”相关的基础配置；
# 2. 端口、数据源、Redis 等模块自身差异化配置，继续留在各自 application-{profile}.yml；
# 3. 开发环境默认走 MinIO 开发桶，尽早和真实对象存储链路保持一致。

healthtrail:
  # 名称
  name: HealthTrail
  # 版本
  version: 1.8.0
  # 版权年份
  copyright-year: 2022
  # 实例演示开关
  demo-enabled: true
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math
  # 对应的公钥放在前端项目中的 utils/rsa_utils 中
  rsaPrivateKey: 
  # 是否检查 i18n 资源文件（messages.properties）是否都有对应的键值对
  checkI18nKey: false
  traceRequestIdKey: AG-RequestId
  storage:
    # 文件存储类型：
    # LOCAL：继续落本地磁盘，通过 /profile/** 对外访问；
    # MINIO：上传到 MinIO，对外直接返回对象访问地址。
    type: MINIO
    minio:
      endpoint: oss-api.dingqidong.com
      bucket: healthtrail-dev
      access-key: blog
      secret-key: F^PbbdM6Xuu&NhF4
      use-ssl: true
      public-url-prefix: https://oss-api.dingqidong.com/healthtrail-dev/
  embedded:
    mysql: false
    redis: false

logging:
  level:
    com.healthtrail: debug
    org.springframework: info
  pattern:
    console: "%date requestId:%X{${healthtrail.traceRequestIdKey}} %thread %green(%level) [%cyan(%logger{10}):%magenta(%line)] %red(%method) | %msg%n"

spring:
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: false
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss

token:
  header: Authorization
  secret: sdhfkjshBN6rr32df38
  autoRefreshTime: 20

mybatis-plus:
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configuration:
    cacheEnabled: true
    useGeneratedKeys: true
    defaultExecutorType: SIMPLE
    logImpl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    refresh: true

pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    groups:
      enabled: true
  packages-to-scan: com.healthtrail

health:
  report:
    parser:
      auto-parse-on-upload: true
      image-ocr-command: ${HEALTH_REPORT_IMAGE_OCR_COMMAND:}
      command-timeout-seconds: ${HEALTH_REPORT_IMAGE_OCR_TIMEOUT_SECONDS:60}
    ocr:
      enabled: false
      provider: ALIYUN
      aliyun:
        access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
        access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
        endpoint: ocr-api.cn-hangzhou.aliyuncs.com
        type: Advanced
        connect-timeout-ms: 10000
        read-timeout-ms: 30000
    ai:
      structured-parse:
        enabled: true
        min-rule-item-count: 2
        max-prompt-text-length: 12000
        prefer-vision-on-image: true
        include-ocr-text-when-vision-enabled: true
        max-image-bytes: 2097152
      external-llm:
        enabled: true
        provider-name: Zhipu-GLM
        api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
        api-key: ${HEALTH_REPORT_EXTERNAL_LLM_API_KEY:a582a862a478452796e890fbb79419e3.qqG3ZLWzytElF3Rf}
        model: ${HEALTH_REPORT_EXTERNAL_LLM_MODEL:GLM-4V-Flash}
        supports-image-input: true
        temperature: 0.2
        max-tokens: 700
        timeout-ms: 15000
        headers:
          X-App-Name: HealthTrail-Health
        system-prompt: >
          你是一名医疗健康管理总结助手。请基于结构化体检报告数据输出简明、可信、
          可执行的中文总结，不要杜撰未提供的信息，不要给出确诊结论。对明确异常的
          重点指标，在医学上能够合理推断时，可补充“可能出现的常见症状/不适表现”
          提示，但必须使用“可能、如伴有、若近期存在”等风险提示语气，不能把症状
          写成已经发生的事实。
