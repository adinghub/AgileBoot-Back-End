server:
  port: 18022
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

spring:
  config:
    import: optional:classpath:application-basic-test.yml
  datasource:
    dynamic:
      primary: master
      strict: false
      druid:
        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
      datasource:
        master:
          driver-class-name: org.h2.Driver
          # test 模式下不能复用固定的 H2 内存库名。
          # 原因是 API、Admin、Domain 测试都会在同一个 JVM 中创建 Spring 上下文，
          # 而固定库名配合 DB_CLOSE_DELAY=-1 会让上一轮上下文关闭后，库对象依旧留在内存里，
          # 下一轮再次执行 schema.sql 时就会出现 “Table already exists”。
          # 这里改为拼接 random.uuid，确保每个上下文拿到独立库实例，初始化脚本可以安全重复执行。
          url: jdbc:h2:mem:healthtrail_api_${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
          username: sa
          password: ''

  h2:
    console:
      enabled: true
      settings:
        trace: true
        web-allow-others: true
      path: /h2-console

  sql:
    init:
      # 动态数据源包装后，显式指定 always 能避免 Spring 因嵌入式库识别链路变化而跳过脚本初始化。
      mode: always
      platform: h2
      encoding: UTF-8
      schema-locations:
        - classpath:h2sql/healthtrail_test_schema.sql
        - classpath:h2sql/health_test_schema.sql
      data-locations:
        - classpath:h2sql/healthtrail_test_data.sql
        - classpath:h2sql/health_test_data.sql

  redis:
    host: 192.168.193.27
    port: 6379
    database: 4
    timeout: 10s
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms

logging:
  file:
    path: D:/logs/healthtrail-api-test

healthtrail:
  file-base-dir: D:\healthtrail
  api-prefix: /test-api
  demo-enabled: false
