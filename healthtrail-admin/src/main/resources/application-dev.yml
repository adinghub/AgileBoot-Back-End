# 管理后台开发环境配置。
server:
    port: 18011
    servlet:
        context-path: /
    tomcat:
        uri-encoding: UTF-8
        accept-count: 1000
        threads:
            max: 800
            min-spare: 100

spring:
    config:
        # 基础公共配置拆到了 infrastructure 模块的 application-basic-dev.yml。
        # 这里显式导入后，当前模块只需要维护“管理后台自身差异”即可。
        import: optional:classpath:application-basic-dev.yml
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: org.postgresql.Driver
        druid:
            webStatFilter:
                enabled: true
            statViewServlet:
                enabled: true
                # 设置白名单，不填则允许所有访问
                allow:
                url-pattern: /druid/*
                # 控制台管理用户名和密码
                # 这里使用新的示例用户名，避免开发人员照抄历史示例值后把旧脚手架命名再次带回配置。
                login-username: healthtrail
                login-password: 123456
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true
        dynamic:
            primary: master
            strict: false
            druid:
                # 初始连接数
                initialSize: 5
                # 最小连接池数量
                minIdle: 10
                # 最大连接池数量
                maxActive: 20
                # 配置获取连接等待超时的时间
                maxWait: 60000
                # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
                timeBetweenEvictionRunsMillis: 60000
                # 配置一个连接在池中最小生存的时间，单位是毫秒
                minEvictableIdleTimeMillis: 300000
                # 配置一个连接在池中最大生存的时间，单位是毫秒
                maxEvictableIdleTimeMillis: 900000
                # 配置检测连接是否有效
                validationQuery: SELECT 1
                testWhileIdle: true
                testOnBorrow: false
                testOnReturn: false
            datasource:
                # 主库数据源
                master:
                    url: jdbc:postgresql://192.168.193.27:5432/healthtrail
                    username: admin_user
                    password: 2bJKlM4bFBIHC3
    redis:
        host: ${TODOTRAIL_REDIS_HOST:192.168.193.27}
        port: ${TODOTRAIL_REDIS_PORT:6379}
        database: ${TODOTRAIL_REDIS_DATABASE:4}
        password:
        timeout: 10s
        lettuce:
            pool:
                min-idle: 0
                max-idle: 8
                max-active: 8
                max-wait: -1ms

logging:
    file:
        path: D:/logs/healthtrail-dev

springdoc:
    swagger-ui:
        enabled: true
        url: ${healthtrail.api-prefix}/v3/api-docs
        config-url: ${healthtrail.api-prefix}/v3/api-docs/swagger-config

healthtrail:
    file-base-dir: D:\healthtrail
    api-prefix: /dev-api
    demo-enabled: false
